services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-saas-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymsaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymsaas_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-gym_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymsaas -d gym_saas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gym-saas-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PNPM_VERSION: "9.15.0"
    container_name: gym-saas-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://gymsaas:gymsaas_secret_2024@postgres:5432/gym_saas?schema=public}
      POSTGRES_USER: ${POSTGRES_USER:-gymsaas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymsaas_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-gym_saas}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-cambia_esto_en_produccion_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambia_esto_en_produccion_refresh}
      PORT: ${PORT:-3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      DEFAULT_GIMNASIO_ID: ${DEFAULT_GIMNASIO_ID:-32f3950a-94af-4b9e-86f9-20b8dab1ef74}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gym-saas-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        PNPM_VERSION: "9.15.0"
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: gym-saas-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - gym-saas-network

volumes:
  postgres_data:
    name: gym-saas-postgres-data
    driver: local

networks:
  gym-saas-network:
    name: gym-saas-network
    driver: bridge
